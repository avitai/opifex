name: Write the format-2 module checkpoint fixture
description: >-
  Writes the format-2 module checkpoint with the substrax release that produced it into the
  gitignored directory the migration test reads. The test raises, naming this command, when the
  directory is missing, so every job that collects it writes the fixture first. The isolated
  environment takes jax, jaxlib and flax from uv.lock, so it neither floats between jobs nor
  drifts from the project environment.

runs:
  using: composite
  steps:
    - name: Write the format-2 module checkpoint with the release that produced it
      shell: bash
      run: python3 scripts/write_format2_fixture.py tests/core/training/fixtures/format2
