name: Security

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    - cron: '0 0 * * 1'  # Weekly on Monday

jobs:
  security-audit:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up uv
      uses: astral-sh/setup-uv@v4
      with:
        enable-cache: true

    - name: Set up Python
      run: uv python install 3.12

    - name: Create virtual environment
      run: uv venv

    - name: Install dependencies
      run: uv pip install -e ".[dev]"

    - name: Run security audit
      # PYSEC-2026-3552 is a PKCS#7 EnvelopedData Bleichenbacher oracle in
      # pkcs7_decrypt_der / _pem / _smime. cryptography reaches opifex only
      # transitively, through mlflow, google-auth and secretstorage; no file under
      # src/ imports cryptography or names pkcs7 or EnvelopedData. The fix is
      # cryptography 50.0.0 and mlflow requires cryptography<50, so the resolver
      # cannot take it. Reviewed 2026-08-27; revisit when mlflow relaxes that ceiling.
      run: |
        uv run pip-audit --skip-editable --ignore-vuln PYSEC-2026-3552

    - name: Run Bandit security linter
      run: |
        uv run bandit -c pyproject.toml -r src/opifex/ -f json -o bandit-report.json
      continue-on-error: true

    - name: Upload Bandit report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: bandit-report
        path: bandit-report.json
