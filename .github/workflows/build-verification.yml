name: Opifex Build Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    env:
      # The tracked .python-version is every uv command's interpreter request, so the
      # matrix version must reach them all; a venv made with another is replaced by uv sync.
      UV_PYTHON: ${{ matrix.python-version }}
    strategy:
      matrix:
        # The macOS runners queue for hours and run the same steps; they run on
        # pushes to main only, so a branch or pull request is gated by the ubuntu
        # jobs alone and the merge to main measures both platforms.
        os: ${{ fromJSON(github.ref == 'refs/heads/main' && '["ubuntu-latest", "macos-15"]' || '["ubuntu-latest"]') }}
        python-version: ["3.12", "3.13"]
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          prune-cache: true
          enable-cache: true
          cache-suffix: "${{ matrix.os }}-${{ matrix.python-version }}"

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      - name: Create virtual environment
        run: uv venv

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Build package
        run: uv build

      - name: Verify package
        run: uv run twine check --strict dist/*

      - name: Test clean-environment import
        run: |
          uv venv test_venv --seed
          # --refresh: a fresh install reads PyPI, not the restored cache, so the walk meets
          # the dependency versions a user installing the wheel gets rather than the lock's.
          # The dev and test extras are the ones the locked unit-test job installs, so the
          # walk skips the same optional root there and here.
          wheel=$(ls dist/*.whl)
          VIRTUAL_ENV=test_venv uv pip install --refresh "${wheel}[dev,test]"
          test_venv/bin/python scripts/check_every_module_imports.py

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.os }}-py${{ matrix.python-version }}
          path: dist/
