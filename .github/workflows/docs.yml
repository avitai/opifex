name: Documentation

# Read the Docs builds and hosts the documentation (.readthedocs.yaml). This workflow only checks
# that the site builds, so a change that breaks it fails before it reaches Read the Docs.

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/workflows/docs.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          prune-cache: true
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Create virtual environment
        run: uv venv

      - name: Install dependencies
        run: uv sync --locked --extra docs

      - name: Build documentation
        # --strict matches RELEASING.md's release check. Without it this gate was the
        # weaker of the two, and a nav entry pointing at a file that never existed sat
        # from the initial commit until a release surfaced it.
        run: uv run mkdocs build --strict --clean
