name: Code Quality Checks

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  quality-checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up uv
      uses: astral-sh/setup-uv@v4
      with:
        enable-cache: true

    - name: Set up Python
      run: uv python install ${{ matrix.python-version }}

    - name: Create virtual environment
      run: uv venv

    - name: Install dependencies
      # neural-dft + quantum-chemistry bring ase/pyscf/kfac-jax, and platform brings
      # fastapi, sqlalchemy and prometheus-client, so pyright can resolve the
      # optional-extra imports in src/ (deployment, platform, quantum) it type-checks.
      # platform used to arrive transitively through avitai-artifex's runtime
      # dependencies; 0.1.4 moved those behind an extra, so it is named here rather
      # than inherited by accident.
      run: uv sync --locked --extra dev --extra neural-dft --extra quantum-chemistry --extra platform

    - name: Run pre-commit hooks
      run: |
        uv run pre-commit run --all-files

    - name: Run type checking with pyright
      run: |
        uv run pyright --warnings

    - name: Run additional ruff checks
      run: |
        uv run ruff check --output-format=github
        uv run ruff format --check

    - name: Check import sorting
      run: |
        uv run ruff check --select I --diff

    - name: Security audit
      run: |
        uv run pip-audit --local --desc
      continue-on-error: true  # Don't fail build on audit issues

  type-safety-report:
    runs-on: ubuntu-latest
    needs: quality-checks
    if: always()

    steps:
    - uses: actions/checkout@v4

    - name: Set up uv
      uses: astral-sh/setup-uv@v4
      with:
        enable-cache: true

    - name: Set up Python
      run: uv python install 3.12

    - name: Create virtual environment
      run: uv venv

    - name: Install dependencies
      # neural-dft + quantum-chemistry bring ase/pyscf/kfac-jax, and platform brings
      # fastapi, sqlalchemy and prometheus-client, so pyright can resolve the
      # optional-extra imports in src/ (deployment, platform, quantum) it type-checks.
      # platform used to arrive transitively through avitai-artifex's runtime
      # dependencies; 0.1.4 moved those behind an extra, so it is named here rather
      # than inherited by accident.
      run: uv sync --locked --extra dev --extra neural-dft --extra quantum-chemistry --extra platform

    - name: Generate type safety report
      run: |
        echo "## Type Safety Report" >> $GITHUB_STEP_SUMMARY
        echo "### Pyright Analysis" >> $GITHUB_STEP_SUMMARY
        uv run pyright --outputjson | jq -r '.summary | "- Errors: \(.errorCount)\n- Warnings: \(.warningCount)\n- Information: \(.informationCount)"' >> $GITHUB_STEP_SUMMARY || true

        echo "### Ruff Analysis" >> $GITHUB_STEP_SUMMARY
        uv run ruff check --statistics --output-format=text | head -20 >> $GITHUB_STEP_SUMMARY || true
