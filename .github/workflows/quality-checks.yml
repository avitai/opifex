name: Code Quality Checks

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  already_tested:
    name: Tree already tested
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.compare.outputs.skip }}
    steps:
    - uses: actions/checkout@v4

    # A merge repeats the pull request; a schedule or a manual run re-measures on purpose. When
    # this step does not run the output is empty, which every consumer reads as "test it". The
    # compare lives in substrax: skip only when this tree is the pull request's and every check
    # of it succeeded.
    - name: Compare this tree with the pull request that produced it
      id: compare
      if: github.event_name == 'push'
      uses: avitai/substrax/.github/actions/already-tested@ec43d80bbae0040375f746cd1bb07dddb0a0b169

  quality-checks:
    runs-on: ubuntu-latest
    needs: [already_tested]
    if: needs.already_tested.outputs.skip != 'true'
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up uv
      uses: astral-sh/setup-uv@v10.2.0
      with:
        prune-cache: true
        enable-cache: true

    - name: Set up Python
      run: uv python install ${{ matrix.python-version }}

    - name: Create virtual environment
      run: uv venv

    - name: Install dependencies
      # neural-dft + quantum-chemistry bring ase/pyscf, and platform brings
      # fastapi, sqlalchemy and prometheus-client, so pyright can resolve the
      # optional-extra imports in src/ (deployment, platform, quantum) it type-checks.
      # platform used to arrive transitively through avitai-artifex's runtime
      # dependencies; 0.1.4 moved those behind an extra, so it is named here rather
      # than inherited by accident.
      run: uv sync --locked --extra dev --extra test --extra neural-dft --extra quantum-chemistry --extra platform

    - name: Run pre-commit hooks
      run: |
        uv run pre-commit run --all-files

    - name: Run type checking with pyright
      run: |
        uv run pyright --warnings

    - name: Run additional ruff checks
      run: |
        uv run ruff check --output-format=github
        uv run ruff format --check

    - name: Check import sorting
      run: |
        uv run ruff check --select I --diff

    - name: Check the README against the operator registry
      env:
        JAX_PLATFORMS: cpu
      run: uv run python scripts/derive_status.py --check

  type-safety-report:
    runs-on: ubuntu-latest
    needs: [quality-checks, already_tested]
    if: always() && needs.already_tested.outputs.skip != 'true'

    steps:
    - uses: actions/checkout@v4

    - name: Set up uv
      uses: astral-sh/setup-uv@v10.2.0
      with:
        prune-cache: true
        enable-cache: true

    - name: Set up Python
      run: uv python install 3.12

    - name: Create virtual environment
      run: uv venv

    - name: Install dependencies
      # neural-dft + quantum-chemistry bring ase/pyscf, and platform brings
      # fastapi, sqlalchemy and prometheus-client, so pyright can resolve the
      # optional-extra imports in src/ (deployment, platform, quantum) it type-checks.
      # platform used to arrive transitively through avitai-artifex's runtime
      # dependencies; 0.1.4 moved those behind an extra, so it is named here rather
      # than inherited by accident.
      run: uv sync --locked --extra dev --extra test --extra neural-dft --extra quantum-chemistry --extra platform

    - name: Generate type safety report
      run: |
        echo "## Type Safety Report" >> $GITHUB_STEP_SUMMARY
        echo "### Pyright Analysis" >> $GITHUB_STEP_SUMMARY
        uv run pyright --outputjson | jq -r '.summary | "- Errors: \(.errorCount)\n- Warnings: \(.warningCount)\n- Information: \(.informationCount)"' >> $GITHUB_STEP_SUMMARY || true

        echo "### Ruff Analysis" >> $GITHUB_STEP_SUMMARY
        uv run ruff check --statistics --output-format=text | head -20 >> $GITHUB_STEP_SUMMARY || true
